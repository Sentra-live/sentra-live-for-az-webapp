[build]
  command = "npm install && node scripts/inline-partials.mjs"
  publish = "."

# ─── Keep .html on internal links ───
# Netlify's "Pretty URLs" post-processing rewrites every internal href from
# ./solutions.html to /solutions. Our canonical tags, og:url and sitemap.xml
# all use the .html form, so that rewrite left every canonical URL with zero
# incoming internal links - Ahrefs' "Canonical URL has no incoming internal
# links" on all 83 pages. The rewrite happens at build time, so it came back
# on every deploy no matter what the source said. Turning it off makes the
# deployed HTML match the source (and the canonicals) exactly.
[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = false

# ─── Collapse the www → apex redirect to a single hop ───
# Without this, Netlify's automatic domain-alias handling does it in two
# hops (http://www -> https://www -> https://apex), which Ahrefs flags as
# a redirect chain.
[[redirects]]
  from = "http://www.sentratech.in/*"
  to = "https://sentratech.in/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sentratech.in/*"
  to = "https://sentratech.in/:splat"
  status = 301
  force = true
# ───────────────────────────────────────────────────────────────────────────

# ─── 301 Redirects for renamed folders (uppercase → lowercase) ───
[[redirects]]
  from = "/Products/*"
  to = "/products/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/Solutions/*"
  to = "/solutions/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/Industries/*"
  to = "/industries/:splat"
  status = 301
  force = true
# ───────────────────────────────────────────────────────────────────────────

# Redirect API calls to backend server
# Option 1: For deployed backend on separate domain (recommended)
# Uncomment and update the domain below to your actual backend API domain
[[redirects]]
  from = "/api/*"
  to = "https://api.sentratech.netlify.app/api/:splat"
  status = 200
  force = false
  headers = { "X-From" = "Netlify" }

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Cache control for static assets
[[headers]]
  for = "/image/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600"
