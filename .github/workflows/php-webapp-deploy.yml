# This workflow will build and push a PHP application to an Azure Web App when a commit is pushed to your default branch.
#
# This workflow assumes you have already created the target Azure App Service web app.
# For instructions see https://docs.microsoft.com/en-us/azure/app-service/quickstart-php?pivots=platform-linux
#
# Authenticates via OIDC federated credentials (Azure Portal's Deployment
# Center default) rather than a publish-profile secret. This requires three
# repo secrets provisioned by that Deployment Center flow:
#   AZUREAPPSERVICE_CLIENTID_93E2A8D8753E4AFF9D797CB82C0E6D84
#   AZUREAPPSERVICE_TENANTID_B997EB84C92D4C72887F5A54FBD01822
#   AZUREAPPSERVICE_SUBSCRIPTIONID_B7B1271B887E4FDA8817EB077D22E588
#
# For more information on GitHub Actions for Azure: https://github.com/Azure/Actions
# For more information on the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# For more samples to get started with GitHub Action workflows to deploy to Azure: https://github.com/Azure/actions-workflow-samples

name: Build and deploy PHP app to Azure Web App

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: az-webapp-sentra-linux-php-srv
  AZURE_WEBAPP_PACKAGE_PATH: '.'      # deploy from the repository root
  PHP_VERSION: '8.x'

permissions:
  contents: read
  id-token: write # required for azure/login OIDC federated credential exchange

# Build and deploy run in a single job - there's no composer.json in this
# repo (just PHP source + static assets), so there's nothing to build that
# differs from the checkout, and no reason to burn GitHub Actions artifact
# storage shipping the checkout between two jobs.
jobs:
  deploy:
    runs-on: ubuntu-latest
    # No `environment:` block here on purpose: setting one changes the OIDC
    # subject claim GitHub sends to `...:environment:<name>`, but the
    # federated credential Azure Portal registered for this app expects the
    # branch-ref subject (`repo:<org>/<repo>:ref:refs/heads/main`) instead -
    # adding an environment caused AADSTS700213 (no matching federated
    # identity record).

    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@7c0b4c8c8ebed23eca9ec2802474895d105b11bc
        with:
          php-version: ${{ env.PHP_VERSION }}

      - name: Check if composer.json exists
        id: check_files
        uses: andstor/file-existence-action@87d74d4732ddb824259d80c8a508c0124bf1c673
        with:
          files: 'composer.json'

      - name: Get Composer Cache Directory
        id: composer-cache
        if: steps.check_files.outputs.files_exists == 'true'
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Set up dependency caching for faster installs
        uses: actions/cache@v3
        if: steps.check_files.outputs.files_exists == 'true'
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Run composer install if composer.json exists
        if: steps.check_files.outputs.files_exists == 'true'
        run: composer validate --no-check-publish && composer install --prefer-dist --no-progress

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_93E2A8D8753E4AFF9D797CB82C0E6D84 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B997EB84C92D4C72887F5A54FBD01822 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B7B1271B887E4FDA8817EB077D22E588 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
